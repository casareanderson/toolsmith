<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Toolsmith on Sanity Context: recall from the Knowledge Base, truth from structure</text>

  <!-- source -->
  <rect x="24" y="70" width="190" height="92" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="119" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Toolsmith weekly runs</text>
  <text x="119" y="118" text-anchor="middle" font-size="12" fill="#334155">fact pack [F001…F245]</text>
  <text x="119" y="136" text-anchor="middle" font-size="12" fill="#334155">recommendations</text>
  <text x="119" y="154" text-anchor="middle" font-size="12" fill="#334155">reports + withheld files</text>

  <rect x="24" y="200" width="190" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="119" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">convert.py · reports.py</text>
  <text x="119" y="246" text-anchor="middle" font-size="12" fill="#334155">deterministic, sanitised</text>
  <line x1="119" y1="162" x2="119" y2="198" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- dataset -->
  <rect x="264" y="70" width="270" height="250" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/>
  <text x="399" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">Sanity dataset "toolsmith"</text>
  <rect x="282" y="110" width="234" height="120" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="296" y="132" font-size="12.5" font-weight="bold" fill="#0f172a">structured (evidence)</text>
  <text x="296" y="152" font-size="11.5" fill="#334155">fact{ measurements[]{value,unit} }</text>
  <text x="296" y="170" font-size="12" fill="#334155">recommendation{ citedFacts[]-&gt;,</text>
  <text x="296" y="188" font-size="12" fill="#334155">   numbersUsed[]{value, fact-&gt;} }</text>
  <text x="296" y="206" font-size="12" fill="#334155">candidateTool{ licenceSpdx }</text>
  <text x="296" y="222" font-size="12" fill="#334155">run · toolArea</text>
  <rect x="282" y="242" width="234" height="62" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="296" y="264" font-size="12.5" font-weight="bold" fill="#0f172a">prose (recall)</text>
  <text x="296" y="284" font-size="12" fill="#334155">report{ kind: report | withheld,</text>
  <text x="296" y="300" font-size="12" fill="#334155">        body, run-&gt; }</text>
  <path d="M214,232 L262,232" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- endpoints -->
  <rect x="584" y="86" width="272" height="78" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="720" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">MCP endpoint "toolsmith" · GROQ mode</text>
  <text x="720" y="130" text-anchor="middle" font-size="12" fill="#334155">initial_context · groq_query</text>
  <text x="720" y="148" text-anchor="middle" font-size="12" fill="#334155">schema_explorer · array_field_reader</text>

  <rect x="584" y="226" width="272" height="78" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="720" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">MCP endpoint "toolsmith-kb" · KB mode</text>
  <text x="720" y="270" text-anchor="middle" font-size="12" fill="#334155">Knowledge Base over report docs</text>
  <text x="720" y="288" text-anchor="middle" font-size="12" fill="#334155">initial_context · knowledge_base_read</text>

  <path d="M534,160 L582,130" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M534,272 L582,266" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- agent -->
  <rect x="264" y="372" width="592" height="164" rx="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/>
  <text x="560" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">agent (Python, stdlib MCP client, any OpenAI-compatible model)</text>

  <rect x="284" y="414" width="170" height="104" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="369" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">model explores</text>
  <text x="369" y="456" text-anchor="middle" font-size="12" fill="#334155">GROQ for what exists,</text>
  <text x="369" y="474" text-anchor="middle" font-size="12" fill="#334155">KB for why and how</text>
  <text x="369" y="498" text-anchor="middle" font-size="11.5" fill="#64748b">free to look at anything</text>

  <rect x="474" y="414" width="186" height="104" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="567" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">present_recommendation</text>
  <text x="567" y="456" text-anchor="middle" font-size="12" fill="#334155">GROQ join via MCP, then</text>
  <text x="567" y="474" text-anchor="middle" font-size="12" fill="#334155">validate(): each number</text>
  <text x="567" y="492" text-anchor="middle" font-size="12" fill="#334155">must be in its fact's</text>
  <text x="567" y="508" text-anchor="middle" font-size="12" fill="#334155">measurements[]</text>

  <rect x="680" y="414" width="156" height="104" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <text x="758" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">answer guard</text>
  <text x="758" y="456" text-anchor="middle" font-size="12" fill="#334155">numbers in the reply</text>
  <text x="758" y="474" text-anchor="middle" font-size="12" fill="#334155">must come from a</text>
  <text x="758" y="492" text-anchor="middle" font-size="12" fill="#334155">SHOWN rec: else one</text>
  <text x="758" y="508" text-anchor="middle" font-size="12" fill="#334155">retry, then redact</text>

  <path d="M454,466 L472,466" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M660,466 L678,466" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M584,150 L562,150 L562,370" stroke="#3b82f6" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M760,304 L760,370" stroke="#8b5cf6" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <text x="24" y="400" font-size="12" fill="#334155">KB text is recall:</text>
  <text x="24" y="418" font-size="12" fill="#334155">a number found only in a</text>
  <text x="24" y="436" font-size="12" fill="#334155">report backs nothing.</text>
  <text x="24" y="466" font-size="12" fill="#334155">Only a structured value,</text>
  <text x="24" y="484" font-size="12" fill="#334155">reached by reference,</text>
  <text x="24" y="502" font-size="12" fill="#334155">can make a claim shown.</text>
</svg>
